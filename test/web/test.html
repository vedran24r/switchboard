<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Switchboard browser tests</title>
<style>
  body { font: 13px/1.4 -apple-system, sans-serif; margin: 12px; background: #fff; color: #111; }
  iframe { width: 1400px; height: 900px; border: 1px solid #ccc; display: block; margin-top: 8px; }
  .ok { color: #15803d; } .fail { color: #b91c1c; font-weight: 600; }
</style>
</head>
<body>
<h1>Switchboard browser tests</h1>
<p>Runs against a test server with fake sessions (<code>npm test</code>). Nothing is sent anywhere.</p>
<ol id="out"></ol>
<iframe id="a" src="/"></iframe>
<script>
/*
 * Every check runs INSIDE the page (frame A, and frame B for the two-tab checks) via the frame's own
 * eval, so it can use the page's functions and state directly. Sending is stubbed: sayText() only records.
 */
const results = [];
const out = document.getElementById("out");
const A = document.getElementById("a");
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const run = (frame, fn, ...args) => frame.contentWindow.eval(`(${fn})(...${JSON.stringify(args)})`);

async function check(name, frame, fn, ...args) {
  let row;
  try { row = { name, ok: true, detail: await run(frame, fn, ...args) }; }
  catch (e) { row = { name, ok: false, detail: String(e?.message ?? e) }; }
  results.push(row); console.log(`[check] ${row.ok ? "PASS" : "FAIL"} ${name} ${row.ok ? "" : row.detail}`);
  const li = document.createElement("li");
  li.className = row.ok ? "ok" : "fail";
  li.textContent = `${row.ok ? "PASS" : "FAIL"} ${name}${row.detail ? " — " + JSON.stringify(row.detail) : ""}`;
  out.appendChild(li);
}

// ---- helpers injected into each frame ----
const HELPERS = () => {
  window.T = {
    sleep: (ms) => new Promise((r) => setTimeout(r, ms)),
    assert(cond, msg) { if (!cond) throw new Error(msg); },
    eq(a, b, msg) { if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error(`${msg}: expected ${JSON.stringify(b)}, got ${JSON.stringify(a)}`); },
    node: (name) => [...nodes.values()].find((n) => n.s.name === name),
    row: (name) => document.querySelector(`#rows .srow-s[data-id="${CSS.escape(T.node(name).s.sessionId)}"]`),
    sent: [],
    async audio(file) {
      const b64 = await (await fetch(`/test/${file}`)).text();
      const bytes = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
      return Float32Array.from(new Int16Array(bytes.buffer), (x) => x / 32768);
    },
    // Feed 16 kHz audio through the real hands-free pipeline, with a fake clock for calibration.
    async feed(samples, { calibrate = false } = {}) {
      hf = { ctx: { sampleRate: 16000, close() {} }, node: { disconnect() {} }, stream: { getTracks: () => [] }, pre: [], seg: [], inSpeech: false, speechRun: 0, silent: 0, segMs: 0, speechMs: 0, noise: 0.01, pending: 0, queue: Promise.resolve() };
      HF.blockMs = 64;
      let fake = 1e12; const realNow = Date.now; Date.now = () => fake;
      calib = calibrate ? { until: fake + 4000, levels: [] } : null;
      try { for (let i = 0; i + 1024 <= samples.length; i += 1024) { if (hf) hfBlock(samples.slice(i, i + 1024)); fake += 64; } }
      finally { Date.now = realNow; }
      const h = hf; if (h) { await hfCut(); await h.queue; }
      hf = null;
    },
  };
  sayText = (m) => { T.sent.push(m); };
  return true;
};

(async () => {
  await new Promise((r) => (A.onload = r));
  await sleep(2500);
  await run(A, HELPERS);

  await check("the list shows every fake session (the dispatcher is not a row)", A, async () => {
    for (let i = 0; i < 20 && nodes.size < 7; i++) await T.sleep(250);
    T.eq([...nodes.values()].map((n) => n.s.name).sort(), ["Beta", "Client", "Compacted", "Old", "Waiting", "Zomb", "repo-abc-12-93"], "sessions");
    T.eq(document.querySelectorAll("#rows .srow-s").length, 7, "rows");
    return nodes.size;
  });

  await check("list rows: status chips, hand-off over the limit, icons", A, () => {
    const st = (name) => T.row(name).querySelector(".st");
    T.eq([st("Old").className, st("Waiting").textContent, st("Beta").textContent], ["st stale", "needs you", "working"], "status chips");
    T.assert(T.row("Beta").querySelector(".rt").classList.contains("hot"), "Beta over hand-off");
    T.assert(!T.row("Compacted").querySelector(".rt").classList.contains("hot"), "Compacted not hot after compact");
    T.assert(T.row("Beta").querySelector(".av").textContent.startsWith("🧪"), "per-session icon override");
    T.assert(T.row("Zomb").querySelector(".av").textContent.startsWith("🎮"), "game area icon");
    return "ok";
  });

  await check("unread dot appears for a new reply and clears when the session is opened", A, () => {
    const z = T.node("Zomb"), keep = seenAt[z.s.sessionId], before = selected;
    seenAt[z.s.sessionId] = 1; updateSessions(state.sessions);
    const shown = !!T.row("Zomb").querySelector(".u");
    select(z.s.sessionId); updateSessions(state.sessions);
    const after = !!T.row("Zomb").querySelector(".u");
    select(before); seenAt[z.s.sessionId] = keep; saveSeen();
    T.assert(shown && !after, `dot shown=${shown}, after opening=${after}`);
    return "ok";
  });

  await check("routes: feed has SendMessage / sb spawn / sb send; a new route flashes that session's row, the open one stays", A, async () => {
    T.eq(state.dispatcher.routes.map((r) => r.kind + ":" + r.target), ["send:Beta", "spawn:New one", "send:Zomb"], "routes");
    select(T.node("Beta").s.sessionId);
    updateRoutes([...state.dispatcher.routes, { id: "t-route", at: Date.now(), kind: "send", target: "Compacted", text: "hello" }]);
    const flashed = T.row("Compacted").classList.contains("flash");
    await T.sleep(100);
    T.eq([nodes.get(selected)?.s.name, flashed], ["Beta", true], "open session, row flash");
    T.assert(document.activeElement === document.body || document.activeElement === input, "focus must not move");
    return "ok";
  });

  await check("sb pulse: known names flash their row in the kind's colour, unknown ignored, nothing sent", A, async () => {
    const res = await (await fetch("/api/pulse", { method: "POST", headers: { "content-type": "application/json", "x-switchboard": "1" }, body: JSON.stringify({ names: ["Waiting", "Nobody"], kind: "needs-you" }) })).json();
    T.eq(res, { pulsed: ["Waiting"], unknown: ["Nobody"] }, "server answer");
    let seen = false;
    for (let i = 0; i < 40 && !seen; i++) { await T.sleep(100); seen = T.row("Waiting").classList.contains("flash-needs-you"); }
    T.assert(seen, "Waiting should flash");
    T.assert(!T.row("Beta").className.includes("flash-needs-you"), "others must not flash");
    T.eq(T.sent.length, 0, "nothing sent");
    return "ok";
  });

  await check("delivery states: queued (pale) while busy, combined messages count as read, not picked up / failed get Retry + Discard", A, async () => {
    const line = (p) => mainLog.els.get(`pending-${p.at}`);
    const r = {};
    // queued behind a busy turn
    const q = { text: "first queued", at: Date.now(), status: "sending", send: async () => {}, busy: () => true };
    pendingSays.push(q); await deliver(q);
    r.queued = q.status; r.queuedPale = line(q)?.classList.contains("st-queued"); r.queuedLabel = /Queued/.test(line(q)?.textContent);
    const q2 = { text: "second queued", at: Date.now() + 1, status: "sending", send: async () => {}, busy: () => true };
    pendingSays.push(q2); await deliver(q2);
    // Claude Code reads both queued messages as ONE combined message
    settlePending(pendingSays, [{ role: "you", at: Date.now(), text: "first queued\nsecond queued" }], false);
    r.bothSettled = !pendingSays.includes(q) && !pendingSays.includes(q2);
    // typed, but never showed up: after 2 min while idle → "not picked up" with Retry
    const s = { text: "lost one", at: Date.now() + 2, status: "sent", typedAt: Date.now() - 200_000 };
    pendingSays.push(s); renderChat(state.dispatcher);
    r.stale = s.status; r.staleRetry = !!line(s)?.querySelector(".retry:not(.discard)");
    pendingSays.splice(pendingSays.indexOf(s), 1); mainLog.drop(`pending-${s.at}`);
    // failed to type → Retry + Discard; Discard removes it
    const f = { text: "will fail", at: Date.now() + 3, status: "sending", send: async () => { throw new Error("no dispatcher"); }, busy: () => false };
    pendingSays.push(f); await deliver(f);
    r.failed = f.status; r.failedText = /Not delivered: no dispatcher/.test(line(f)?.textContent);
    line(f).querySelector(".discard").click(); await T.sleep(50);
    r.discarded = !line(f) && !pendingSays.includes(f);
    renderChat(state.dispatcher);
    T.eq(r, { queued: "queued", queuedPale: true, queuedLabel: true, bothSettled: true, stale: "stale", staleRetry: true, failed: "failed", failedText: true, discarded: true }, "states");
    return "ok";
  });

  await check("hide message: × removes a line from view only, remembered", A, async () => {
    const id = state.dispatcher.chat[0].id, el = mainLog.els.get(id);
    T.assert(el, "line exists"); el.querySelector(".hide").click(); await T.sleep(50);
    T.assert(!mainLog.els.get(id) && !document.body.contains(el), "line gone");
    T.assert(JSON.parse(localStorage.getItem("sb-hidden")).includes(id), "remembered");
    renderChat(state.dispatcher); T.assert(!mainLog.els.get(id), "stays hidden after refresh");
    window.__hiddenId = id;
    return "ok";
  });

  await check("images: paste a big screenshot → downscaled, uploaded, sent as [image: path], shown as thumbnail, click enlarges", A, async () => {
    const canvas = Object.assign(document.createElement("canvas"), { width: 3200, height: 2000 });
    const g = canvas.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, 3200, 2000); g.fillStyle = "#000"; g.font = "64px sans-serif"; g.fillText("Error: test screenshot", 100, 200);
    const blob = await new Promise((r) => canvas.toBlob(r, "image/png"));
    const dt = new DataTransfer(); dt.items.add(new File([blob], "shot.png", { type: "image/png" }));
    input.focus(); input.dispatchEvent(new ClipboardEvent("paste", { clipboardData: dt, bubbles: true, cancelable: true }));
    T.eq(mainComposer.attachments.length, 1, "attached");
    await mainComposer.attachments[0].ready;
    const a = mainComposer.attachments[0];
    T.assert(!a.error, "upload error: " + a.error);
    T.assert(Math.max(a.w, a.h) <= 2560, `downscaled to ${a.w}x${a.h}`);
    T.assert(document.querySelector("#composer .tray img"), "thumbnail in the tray");
    T.sent.length = 0; input.value = "what does this error mean?";
    $("composer").requestSubmit(); for (let i = 0; i < 30 && !T.sent.length; i++) await T.sleep(100);
    T.assert(/^what does this error mean\?\n\[image: \/.+\/uploads\/switchboard\/switchboard-[\w-]+\.png\]$/.test(T.sent[0]), "message: " + T.sent[0]);
    T.eq(mainComposer.attachments.length, 0, "tray cleared");
    mainLog.sync([...state.dispatcher.chat, { id: "t-img", role: "you", text: T.sent[0], at: Date.now() }]);
    const img = mainLog.els.get("t-img").querySelector(".chatimg");
    T.assert(img, "thumbnail in the chat");
    for (let i = 0; i < 30 && !img.naturalWidth; i++) await T.sleep(100);
    T.assert(img.naturalWidth > 0, "image loads from /api/upload");
    img.click(); T.assert($("lightbox").classList.contains("open"), "click enlarges");
    dispatchEvent(new KeyboardEvent("keydown", { key: "Escape" })); T.assert(!$("lightbox").classList.contains("open"), "Esc closes");
    // refused type
    mainComposer.attach(new File(["BM"], "x.bmp", { type: "image/bmp" })); await mainComposer.attachments[0].ready;
    T.assert(/only PNG/.test(mainComposer.attachments[0].error), "bmp refused: " + mainComposer.attachments[0].error);
    document.querySelector("#composer .tray [data-rm]").click(); T.eq(mainComposer.attachments.length, 0, "× removes");
    window.__imgPath = T.sent[0].split("[image: ")[1].slice(0, -1);
    return `${a.w}x${a.h}`;
  });

  await check("images: an attached image goes out with the next hands-free message", A, async () => {
    const canvas = Object.assign(document.createElement("canvas"), { width: 200, height: 100 });
    canvas.getContext("2d").fillRect(0, 0, 50, 50);
    mainComposer.attach(new File([await new Promise((r) => canvas.toBlob(r, "image/png"))], "s.png", { type: "image/png" }));
    T.sent.length = 0; input.value = ""; autoSend = true; gate = { on: false, baseline: null, sens: 10 };
    await T.feed(await T.audio("hf.b64"));
    T.eq(T.sent.length, 2, "two spoken messages");
    T.assert(/flaky/i.test(T.sent[0]) && /\[image: .+\.png\]/.test(T.sent[0]), "image with the first: " + T.sent[0]);
    T.assert(!/\[image:/.test(T.sent[1]), "not repeated on the second");
    return "ok";
  });

  await check("panel reply box: a very long message grows only into the room left, never past the panel's bottom", A, async () => {
    select(T.node("Beta").s.sessionId); await T.sleep(150);
    document.querySelector("#panel .replyhere")?.click(); await T.sleep(50);
    const inp = $("p-input"), send = $("p-form").querySelector(".send");
    inp.value = "A long dictated message for Sam about ABC-12. ".repeat(120); inp.dispatchEvent(new Event("input"));
    await T.sleep(100);
    const p = panel.getBoundingClientRect(), b = inp.getBoundingClientRect(), s = send.getBoundingClientRect();
    const r = { boxInside: b.bottom <= p.bottom + 1 && b.height > 40, sendInside: s.bottom <= p.bottom + 1, scrolls: inp.scrollHeight > inp.clientHeight, logShown: $("p-log").clientHeight >= 60 };
    inp.value = ""; inp.dispatchEvent(new Event("input")); inp.blur(); select(null);
    T.eq(r, { boxInside: true, sendInside: true, scrolls: true, logShown: true }, "long reply");
    return "ok";
  });

  await check("quick replies: '?' on waiting rows; the pane's buttons send via the reply path on click; blocked folder gets none", A, async () => {
    T.sent.length = 0;
    T.assert(T.row("Waiting").querySelector(".q"), "? on Waiting");
    T.assert(!T.row("Compacted").querySelector(".q"), "no ? on Compacted");
    select(T.node("Waiting").s.sessionId); await T.sleep(100);
    const labels = [...document.querySelectorAll("#p-quick button")].map((b) => b.textContent);
    T.eq(labels, ["Yes", "No", "Other…"], "buttons");
    T.assert(/Sends “yes”/.test(document.querySelector("#p-quick [data-q='0']").title), "tooltip shows what is sent");
    document.querySelector("#p-quick [data-q='0']").click();
    for (let i = 0; i < 30 && !$("p-quicknote").textContent; i++) await T.sleep(100);
    // the fake session has no terminal, so the real path answers with its error: proves the click went to /api/session/say
    T.assert(/Not sent: .*doesn't run in tmux/.test($("p-quicknote").textContent), $("p-quicknote").textContent);
    document.querySelector("#p-quick .other").click(); await T.sleep(50);
    T.assert(document.activeElement === $("p-input"), "Other… focuses the reply box");
    select(T.node("Client").s.sessionId); await T.sleep(100);
    T.eq(document.querySelectorAll("#p-quick button").length, 0, "no buttons for the blocked folder");
    T.assert(/Quick replies are off/.test($("p-quick").textContent), "explains why");
    $("p-input")?.blur(); select(null);
    T.eq(T.sent.length, 0, "nothing went to Switchboard");
    return "ok";
  });

  await check("quick replies: several open questions → a note and Answer…, no buttons that repeat the questions", A, () => {
    const n = T.node("Compacted"), saved = n.s.ask;
    n.s.ask = { kind: "question", options: [], note: "It asked 3 questions: answer them in the reply box." };
    select(n.s.sessionId);
    const box = $("p-quick"), r = { note: /asked 3 questions/.test(box.textContent), buttons: [...box.querySelectorAll("button")].map((b) => b.textContent) };
    box.querySelector('[data-q="other"]').click();
    r.replyOpen = !$("p-form").classList.contains("collapsed");
    n.s.ask = saved; select(null);
    T.eq(r, { note: true, buttons: ["Answer…"], replyOpen: true }, "note");
    return "ok";
  });

  // ---- session sheet: terminal view, quick keys, standing chips. The test server's tmux wrapper answers for
  // pk-claude-beta (test/browser.ts); nothing reaches a real tmux server. ----
  await check("terminal view: Chat / Terminal toggle shows the pane as escaped coloured text, monospace, pinned to the bottom", A, async () => {
    localStorage.removeItem("sb-view"); sheetView = "chat";
    select(T.node("Beta").s.sessionId); await T.sleep(100);
    T.eq(popup.view, "chat", "starts in Chat");
    T.assert(getComputedStyle($("p-term")).display === "none" && getComputedStyle($("p-log")).display !== "none", "chat shown, terminal hidden");
    document.querySelector('#p-view [data-view="term"]').click();
    const term = $("p-term");
    for (let i = 0; i < 40 && !/tick/.test(term.textContent); i++) await T.sleep(100);
    T.assert(getComputedStyle(term).display !== "none" && getComputedStyle($("p-log")).display === "none", "terminal shown, chat hidden");
    T.assert(term.textContent.includes(`<script>window.__pwned = 1<\/script> <img src=x onerror="window.__pwned=1"> &`), "markup shows as text");
    T.assert(!term.querySelector("script, img") && !window.__pwned, "no elements made from pane content");
    T.assert(!/\x1b|title|\[\?25l/.test(term.textContent), "other escape sequences dropped");
    const span = (t) => [...term.querySelectorAll("span")].find((s) => s.textContent === t);
    T.eq([span("✔ tests pass")?.style.color, span("✔ tests pass")?.style.fontWeight, span("red 256")?.style.color, span("true colour")?.style.color],
      ["rgb(13, 188, 121)", "700", "rgb(255, 0, 0)", "rgb(10, 200, 30)"], "colours and bold");
    T.assert(/Menlo|monospace/.test(getComputedStyle(term).fontFamily), "monospace");
    T.assert(term.scrollWidth > term.clientWidth, "long lines scroll sideways");
    T.assert(term.scrollHeight - term.scrollTop - term.clientHeight < 24, "pinned to the bottom");
    term.scrollTop = 0; const tick = term.textContent.match(/tick \d+/)[0];
    for (let i = 0; i < 30 && term.textContent.includes(tick); i++) await T.sleep(100);
    T.assert(!term.textContent.includes(tick), "screen refreshed");
    T.eq(term.scrollTop, 0, "scrolled up: the lines you're reading stay put");
    setView("chat"); select(null);
    return "ok";
  });
  await check("terminal view: polls about once a second only while it shows and the page is visible", A, async () => {
    const real = window.fetch, calls = [];
    window.fetch = (u, o) => { if (String(u).startsWith("/api/session/screen")) calls.push(Date.now()); return real(u, o); };
    const since = (c) => calls.length - c;
    try {
      select(T.node("Beta").s.sessionId); await T.sleep(1500);
      const r = { inChat: calls.length };
      setView("term"); let c = calls.length; await T.sleep(3100); r.inTerm = since(c);
      Object.defineProperty(document, "hidden", { configurable: true, get: () => true }); document.dispatchEvent(new Event("visibilitychange"));
      c = calls.length; await T.sleep(2200); r.hidden = since(c);
      c = calls.length; delete document.hidden; Object.defineProperty(document, "hidden", { configurable: true, get: () => false }); document.dispatchEvent(new Event("visibilitychange"));
      await T.sleep(400); r.resumed = since(c) >= 1;
      setView("chat"); await T.sleep(100); c = calls.length; await T.sleep(1500); r.backToChat = since(c);
      setView("term"); await T.sleep(100); select(null); c = calls.length; await T.sleep(1500); r.closed = since(c);
      T.assert(r.inTerm >= 2 && r.inTerm <= 5, `about 1/s in Terminal: ${r.inTerm} in 3.1 s`);
      T.eq([r.inChat, r.hidden, r.resumed, r.backToChat, r.closed], [0, 0, true, 0, 0], "polls only while shown and visible");
      return r;
    } finally { delete document.hidden; window.fetch = real; setView("chat"); select(null); }
  });
  await check("terminal view: refused for a blocked folder (server says 403, the page doesn't even ask); GET only", A, async () => {
    const id = T.node("Client").s.sessionId;
    const res = await fetch(`/api/session/screen?id=${encodeURIComponent(id)}`), d = await res.json();
    const post = await fetch(`/api/session/screen?id=${encodeURIComponent(id)}`, { method: "POST", headers: { "content-type": "application/json", "x-switchboard": "1" }, body: "{}" });
    const real = window.fetch, calls = [];
    window.fetch = (u, o) => { if (String(u).startsWith("/api/session/screen")) calls.push(u); return real(u, o); };
    try {
      select(id); setView("term"); await T.sleep(1300);
      const r = { status: res.status, blocked: d.blocked, says: /off for this folder \(blocked\)/.test(d.error), post: post.status, asked: calls.length,
        shown: /off for this folder/.test($("p-term").textContent), tools: $("p-tools").children.length };
      T.eq(r, { status: 403, blocked: true, says: true, post: 404, asked: 0, shown: true, tools: 0 }, "blocked");
      return "ok";
    } finally { window.fetch = real; setView("chat"); select(null); }
  });
  await check("terminal text size: A− / A+ only in the Terminal view, change the font, remembered", A, async () => {
    select(T.node("Beta").s.sessionId);
    const tz = () => [...$("p-view").querySelectorAll(".tz")];
    setView("chat");
    const hiddenInChat = tz().every((b) => getComputedStyle(b).display === "none");
    setView("term");
    const shown = tz().every((b) => getComputedStyle(b).display !== "none");
    const before = parseFloat(getComputedStyle($("p-term")).fontSize);
    tz()[1].click(); tz()[1].click();
    const bigger = parseFloat($("p-term").style.fontSize);
    tz()[0].click();
    const r = { hiddenInChat, shown, grew: bigger === before + 2, saved: localStorage.getItem("sb-termsize") === String(before + 1) };
    try { localStorage.removeItem("sb-termsize"); } catch {}
    termSize = 0; applyTermSize(); setView("chat"); select(null);
    T.eq(r, { hiddenInChat: true, shown: true, grew: true, saved: true }, "zoom");
    return "ok";
  });
  await check("quick keys: Stop, arrows, Enter, Space, Tab, Shift+Tab, Esc, 1–9 post the right keys; Ctrl+C needs a second tap", A, async () => {
    const real = window.fetch, keys = [];
    window.fetch = (u, o) => { if (String(u) === "/api/session/key") keys.push(JSON.parse(o.body)); return real(u, o); };
    try {
      select(T.node("Beta").s.sessionId);
      for (let i = 0; i < 30 && !popup.canType; i++) await T.sleep(100);
      const bar = () => $("p-tools").querySelector(".qkeys");
      T.assert(bar() && !$("p-tools").classList.contains("readonly"), "keys bar, usable");
      T.eq([...bar().querySelectorAll("button")].map((b) => b.textContent), ["■ Stop", "↑", "↓", "←", "→", "Enter", "Space", "Tab", "⇧Tab", "Esc", "Ctrl+C", "1", "2", "3", "4", "5", "6", "7", "8", "9"], "buttons");
      for (const b of [...bar().querySelectorAll("button")].filter((b) => b.dataset.key !== "ctrlc")) { b.click(); await T.sleep(60); }
      for (let i = 0; i < 30 && !/Pressed 9/.test($("p-quicknote").textContent); i++) await T.sleep(100);
      const ctrl = bar().querySelector('[data-key="ctrlc"]');
      ctrl.click(); await T.sleep(300);

      const n = window.__net; n.calls.push({ url: String(url), body: opts.body });
      if (n.hang) return new Promise((_, reject) => opts.signal?.addEventListener("abort", () => reject(new DOMException("timeout", "TimeoutError"))));
      if (n.down) return Promise.reject(new TypeError("Failed to fetch"));
      // Lost response: the request reaches the "server", the answer never comes back.
      if (n.lose && String(url) === "/api/say") return Promise.reject(new TypeError("network changed"));
      if (String(url) === "/api/say") return Promise.resolve(new Response(JSON.stringify({ ok: true }), { status: 200 }));
      return window.__real(url, opts);

    // The phone kills the page: a fresh list restored from the outbox has it again, with the same id.

    r.restored = back?.status; r.sameId = back?.id === p.id;
    // Connection back: sent by itself, exactly once.
