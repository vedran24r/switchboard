# Config for Switchboard's own tmux server (`tmux -L switchboard`), which hosts sb-* sessions
# (started by `sb run`, or from the map/phone) and the dispatcher. A separate socket keeps these
# settings away from any other tmux use.

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB"
set -g mouse on
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on
# Claude Code's desktop notifications and shift+enter need these.
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features ",*:extkeys"
# Pass each pane's title (Claude's own OSC 2) through to the terminal tab.
set -g set-titles on
set -g set-titles-string "#{pane_title}"

set -g status-style "bg=default,fg=colour244"
set -g status-left "#[fg=colour141]#S "
set -g status-left-length 40
set -g status-right "switchboard"

# Closing a terminal window ends its session: once a terminal is attached, losing the last one destroys
# the session (set on attach, not at creation, so sessions started from the map/phone survive with no
# terminal). @sb_keep opts a session out. Detaching on purpose (prefix + d) keeps it running.
set-hook -g client-attached 'if -F "#{!=:#{@sb_keep},1}" "set-option destroy-unattached on"'
bind-key d set-option destroy-unattached off \; detach-client
